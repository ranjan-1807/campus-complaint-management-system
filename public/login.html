<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusCare Login</title><style>body{margin:0;background:#f6f8fb;font-family:Inter,system-ui,sans-serif;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e5e9f0;border-radius:20px;padding:30px;box-shadow:0 12px 40px #18233b12}h1{margin:0 0 8px}.brand{font-weight:800;font-size:20px;margin-bottom:30px}.brand span{color:#3157d5}.muted{color:#64748b;line-height:1.5}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6dce6;border-radius:10px;font:inherit;margin:10px 0}button{width:100%;border:0;border-radius:10px;padding:13px;background:#3157d5;color:white;font-weight:700;font:inherit;cursor:pointer}.error{color:#c53b3b;font-size:13px;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><div class="brand">Campus<span>Care</span></div><h1 id="title">Sign in</h1><p id="help" class="muted">Enter your institutional email. We'll send a secure one-time code.</p><div id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="name@college.edu"><button onclick="send()">Send verification code</button></div><div id="msg"></div></div></div><script>const A=window.hatchable.auth;let email="";async function send(){try{email=document.getElementById("email").value.trim();if(!email)throw Error("Enter your email");const r=await A.startLogin({email});if(r.has_passkey&&A.supportsPasskeys()){try{const x=await A.signInWithPasskey({email});location.href=new URLSearchParams(location.search).get("next")||"/";return}catch(e){}}document.getElementById("title").textContent="Check your email";document.getElementById("help").textContent="Enter the 6-digit code sent to "+email;document.getElementById("form").innerHTML='<input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code"><button onclick="verify()">Sign in</button>'}catch(e){document.getElementById("msg").innerHTML='<div class="error">'+e.message+'</div>'}}async function verify(){try{const code=document.getElementById("code").value.trim();await A.verifyCode({email,code});location.href=new URLSearchParams(location.search).get("next")||"/"}catch(e){document.getElementById("msg").innerHTML='<div class="error">'+e.message+'</div>'}}</script></body></html>
